<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tcomp session</title>
<link rel="stylesheet" href="/static/xterm.css">
<link rel="stylesheet" href="/static/app.css">
<style>
  body { display: flex; flex-direction: column; overflow: hidden; }
  .back { color: var(--muted); font-size: 20px; line-height: 1; padding: 0 4px; }
  .back:hover { color: var(--text); }
  .size { color: var(--muted); font-size: 12px; font-family: ui-monospace, Menlo, monospace; }

  .notice {
    display: none;
    padding: 8px 18px;
    background: #232b38;
    border-bottom: 1px solid var(--edge);
    color: var(--muted);
    font-size: 13px;
  }
  .notice.show { display: block; }

  .banner {
    display: none;
    padding: 7px 18px;
    background: #1a2a1a;
    border-bottom: 1px solid #2a3f2a;
    color: #3ddc84;
    font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    align-items: center;
    gap: 10px;
  }
  .banner.show { display: flex; }
  .banner .banner-text { flex: 1; }
  .banner .banner-dismiss {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    padding: 0 2px;
    line-height: 1;
  }
  .banner .banner-dismiss:hover { color: var(--text); }

  #stage {
    flex: 1;
    min-height: 0;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 10px;
    background: #05070b;
  }

  #host { touch-action: pan-x pinch-zoom; }
  body.frozen #host { filter: grayscale(.85) brightness(.82); }
  .xterm .xterm-viewport { overflow-y: auto; }

  .keyboard-toggle {
    display: grid;
    place-items: center;
    width: 38px;
    height: 34px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .keyboard-toggle[hidden] { display: none; }
  .keyboard-toggle:hover { color: var(--text); background: var(--panel); }
  .keyboard-toggle[aria-expanded="true"] {
    color: var(--text);
    border-color: var(--edge);
    background: var(--panel-2);
  }
  .keyboard-toggle:focus-visible {
    outline: 2px solid var(--ended);
    outline-offset: 1px;
  }
  .keyboard-toggle svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.5;
  }

  .keybar {
    display: none;
    flex: none;
    align-items: stretch;
    gap: 9px;
    padding: 9px max(10px, env(safe-area-inset-right))
      calc(11px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    border-top: 1px solid var(--edge);
    background: linear-gradient(180deg, #171e29, var(--panel));
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-x: contain;
    scrollbar-color: #39475b transparent;
    scrollbar-width: thin;
  }
  .keybar.show { display: flex; }
  .key-group {
    display: flex;
    flex: none;
    gap: 6px;
  }
  .key-group + .key-group {
    padding-left: 9px;
    border-left: 1px solid var(--edge);
  }
  .keybar button {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-width: 46px;
    height: 44px;
    padding: 0 10px;
    border: 1px solid #334155;
    border-bottom-color: #1b2533;
    border-radius: 8px;
    background: linear-gradient(180deg, #263245, #1c2635);
    box-shadow: 0 2px 0 #080b10, 0 4px 10px rgba(0, 0, 0, .22);
    color: var(--text);
    font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .keybar button:hover {
    border-color: #465871;
    background: linear-gradient(180deg, #2c3a4f, #222d3e);
  }
  .keybar button:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 #080b10, 0 1px 4px rgba(0, 0, 0, .2);
  }
  .keybar button:focus-visible {
    outline: 2px solid var(--ended);
    outline-offset: 2px;
  }
  .keybar button[aria-pressed="true"] {
    border-color: var(--ended);
    background: linear-gradient(180deg, #31547e, #263f61);
    box-shadow: 0 2px 0 #13243a, 0 0 0 1px rgba(91, 157, 255, .2);
    color: #fff;
  }
  .keybar .modifier { min-width: 70px; }
  .key-mod {
    color: #9aa9bd;
    font-size: 10px;
    font-weight: 500;
  }
  .key-symbol { font-size: 17px; }

  @media (max-width: 560px) {
    .topbar { padding: 10px 12px; gap: 8px; }
    .size { display: none; }
    #stage { padding: 4px; align-items: flex-start; }
    .keybar { gap: 8px; }
    .key-group + .key-group { padding-left: 8px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="/" title="All sessions">‹</a>
  <div class="title"><b id="name">…</b><em id="details"></em></div>
  <div class="spacer"></div>
  <div class="size" id="size"></div>
  <button class="keyboard-toggle" id="keyboard-toggle" type="button" aria-controls="keybar" aria-expanded="true" aria-label="Hide terminal keys" title="Hide terminal keys" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"></rect><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M10 13h.01M14 13h.01M18 13h.01M8 16h8"></path></svg>
  </button>
  <div class="badge" id="badge"></div>
</header>
<div class="notice" id="notice"></div>
<div class="banner" id="banner"><span class="banner-text"></span><button class="banner-dismiss" id="banner-dismiss">×</button></div>
<main id="stage"><div id="host"></div></main>
<nav class="keybar" id="keybar" aria-label="Terminal keys" aria-hidden="true">
  <div class="key-group">
    <button class="modifier" type="button" data-modifier="shift" aria-pressed="false">Shift</button>
    <button class="modifier" type="button" data-modifier="ctrl" aria-pressed="false">Ctrl</button>
  </div>
  <div class="key-group">
    <button type="button" data-key="escape" aria-label="Escape">Esc</button>
    <button type="button" data-key="tab">Tab</button>
  </div>
  <div class="key-group">
    <button type="button" data-key="home">Home</button>
    <button type="button" data-key="end">End</button>
    <button type="button" data-key="pageUp" aria-label="Page Up">PgUp</button>
    <button type="button" data-key="pageDown" aria-label="Page Down">PgDn</button>
  </div>
  <div class="key-group">
    <button type="button" data-key="left" aria-label="Left arrow"><span class="key-symbol">←</span></button>
    <button type="button" data-key="down" aria-label="Down arrow"><span class="key-symbol">↓</span></button>
    <button type="button" data-key="up" aria-label="Up arrow"><span class="key-symbol">↑</span></button>
    <button type="button" data-key="right" aria-label="Right arrow"><span class="key-symbol">→</span></button>
  </div>
  <div class="key-group">
    <button type="button" data-key="f1">F1</button>
    <button type="button" data-key="f2">F2</button>
    <button type="button" data-key="f3">F3</button>
    <button type="button" data-key="f4">F4</button>
    <button type="button" data-key="f5">F5</button>
    <button type="button" data-key="f6">F6</button>
    <button type="button" data-key="f7">F7</button>
    <button type="button" data-key="f8">F8</button>
    <button type="button" data-key="f9">F9</button>
    <button type="button" data-key="f10">F10</button>
    <button type="button" data-key="f11">F11</button>
    <button type="button" data-key="f12">F12</button>
  </div>
</nav>

<script src="/static/xterm.js"></script>
<script>
const id = location.pathname.split('/').filter(Boolean).pop();
const stage = document.getElementById('stage');
const host = document.getElementById('host');
const badge = document.getElementById('badge');
const notice = document.getElementById('notice');
const BASE_FONT = 15;
const MIN_FONT = 4;
const MAX_FONT = 34;
const PAD = 10;
const KEYBAR_KEY = 'tcomp.terminal-keys';
const TOUCH_SLOP = 6;
const FLING_DECAY = 0.94;
const FLING_CUTOFF = 0.04;
const FLING_GAP = 120;
const MAX_FLING = 4;
const MAX_ALT_LINES = 24;
const keySequences = {
  escape: '\x1b',
  tab: '\t',
  home: '\x1b[H',
  end: '\x1b[F',
  pageUp: '\x1b[5~',
  pageDown: '\x1b[6~',
  left: '\x1b[D',
  down: '\x1b[B',
  up: '\x1b[A',
  right: '\x1b[C',
  f1: '\x1bOP',
  f2: '\x1bOQ',
  f3: '\x1bOR',
  f4: '\x1bOS',
  f5: '\x1b[15~',
  f6: '\x1b[17~',
  f7: '\x1b[18~',
  f8: '\x1b[19~',
  f9: '\x1b[20~',
  f10: '\x1b[21~',
  f11: '\x1b[23~',
  f12: '\x1b[24~',
};

let term = null;
let socket = null;
let cols = 80;
let rows = 24;
let passes = 0;
let backoff = 500;
let allowInput = false;
let status = 'live';
let failures = 0;
let sessionName = '';
let sessionCmd = '';
let sessionTitle = '';
let sessionCwd = '';
let keybarOpen = loadKeybarPreference();
let touchId = null;
let touchY = 0;
let touchAt = 0;
let touchVelocity = 0;
let touchResidue = 0;
let dragging = false;
let fling = null;
let shiftActive = false;
let ctrlActive = false;
const encoder = new TextEncoder();
const keybar = document.getElementById('keybar');
const keyboardToggle = document.getElementById('keyboard-toggle');
const shiftKey = keybar.querySelector('[data-modifier="shift"]');
const ctrlKey = keybar.querySelector('[data-modifier="ctrl"]');

function loadKeybarPreference() {
  try {
    return localStorage.getItem(KEYBAR_KEY) !== 'hidden';
  } catch (_) {
    return true;
  }
}

function storeKeybarPreference() {
  try {
    localStorage.setItem(KEYBAR_KEY, keybarOpen ? 'shown' : 'hidden');
  } catch (_) {}
}

function ensureTerminal() {
  if (term) return;
  term = new Terminal({
    cols, rows,
    fontSize: BASE_FONT,
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
    scrollback: 5000,
    disableStdin: true,
    cursorBlink: false,
    theme: { background: '#05070b', foreground: '#dbe3ef' },
  });
  term.open(host);
  term.onData((data) => {
    if (ctrlActive || shiftActive) {
      const composed = compose(data);
      setShift(false);
      setCtrl(false);
      send(composed);
    } else {
      send(data);
    }
  });
  scheduleFit();
}

function send(data) {
  if (!allowInput || status !== 'live' || !data) return;
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(encoder.encode(data));
  }
}

function setShift(active) {
  shiftActive = active;
  shiftKey.setAttribute('aria-pressed', String(active));
}

function setCtrl(active) {
  ctrlActive = active;
  ctrlKey.setAttribute('aria-pressed', String(active));
}

function compose(sequence) {
  if (ctrlActive && sequence.length === 1 && /[a-zA-Z]/.test(sequence)) {
    return String.fromCharCode(sequence.toLowerCase().charCodeAt(0) - 96);
  }
  if (shiftActive) {
    if (sequence === '\t') return '\x1b[Z';
    if (sequence >= 'a' && sequence <= 'z') sequence = sequence.toUpperCase();
  }
  return sequence;
}

function applyInput(enabled) {
  allowInput = enabled;
  const active = enabled && status === 'live';
  const open = active && keybarOpen;
  keybar.classList.toggle('show', open);
  keybar.setAttribute('aria-hidden', String(!open));
  keyboardToggle.hidden = !active;
  keyboardToggle.setAttribute('aria-expanded', String(open));
  keyboardToggle.setAttribute('aria-label', keybarOpen ? 'Hide terminal keys' : 'Show terminal keys');
  keyboardToggle.title = keybarOpen ? 'Hide terminal keys' : 'Show terminal keys';
  if (!open) {
    setShift(false);
    setCtrl(false);
  }
  if (term) {
    term.options.disableStdin = !active;
    if (active) term.focus();
  }
  scheduleFit();
}

function screenEl() {
  return host.querySelector('.xterm-screen');
}

function scheduleFit() {
  passes = 0;
  requestAnimationFrame(refit);
}

function refit() {
  if (!term) return;
  const el = screenEl();
  if (!el || !el.offsetWidth) {
    if (passes++ < 20) requestAnimationFrame(refit);
    return;
  }

  const banner = document.getElementById('banner');
  const chrome = document.querySelector('.topbar').offsetHeight
    + (notice.classList.contains('show') ? notice.offsetHeight : 0)
    + (banner.classList.contains('show') ? banner.offsetHeight : 0)
    + (keybar.classList.contains('show') ? keybar.offsetHeight : 0);
  const availW = Math.max(60, document.documentElement.clientWidth - PAD);
  const availH = Math.max(60, document.documentElement.clientHeight - chrome - PAD);

  const ratio = Math.min(availW / el.offsetWidth, availH / el.offsetHeight);
  const current = term.options.fontSize;
  const next = Math.min(MAX_FONT, Math.max(MIN_FONT, Math.floor(current * ratio * 2) / 2));

  if (next !== current && passes++ < 6) {
    term.options.fontSize = next;
    setTimeout(refit, 60);
    return;
  }
  document.getElementById('size').textContent = `${cols}\u00d7${rows}`;
}

function applyStatus(next, exitCode) {
  status = next;
  badge.className = `badge ${status}`;
  badge.textContent = status === 'live'
    ? (allowInput ? 'interactive' : 'live')
    : status === 'ended' ? 'finished' : 'disconnected';
  document.body.classList.toggle('frozen', status !== 'live');
  applyInput(allowInput);
  if (status === 'live') {
    notice.classList.remove('show');
    return;
  }
  notice.textContent = status === 'ended'
    ? `Session ended${exitCode != null ? ` (exit ${exitCode})` : ''}. Showing final output.`
    : 'Host disconnected. History only — this view will not update again.';
  notice.classList.add('show');
}

function renderDetails() {
  const details = [sessionCwd, sessionCmd].filter(Boolean).join(' · ');
  document.getElementById('details').textContent = details;
  document.getElementById('name').textContent = sessionTitle || sessionName;
  document.title = `${sessionTitle || sessionName} — tcomp`;
}

function onControl(frame) {
  if (frame.t === 'init') {
    failures = 0;
    cols = frame.cols;
    rows = frame.rows;
    sessionName = frame.name;
    sessionCmd = frame.cmd;
    sessionTitle = frame.title || '';
    sessionCwd = frame.cwd || '';
    renderDetails();
    ensureTerminal();
    if (term.cols !== cols || term.rows !== rows) {
      term.resize(cols, rows);
    }
    scheduleFit();
    allowInput = !!frame.input;
    applyStatus(frame.status);
  } else if (frame.t === 'resize') {
    cols = frame.cols;
    rows = frame.rows;
    ensureTerminal();
    term.resize(cols, rows);
    scheduleFit();
  } else if (frame.t === 'status') {
    applyStatus(frame.status);
  } else if (frame.t === 'exit') {
    applyStatus('ended', frame.code);
  } else if (frame.t === 'banner') {
    const el = document.getElementById('banner');
    el.querySelector('.banner-text').textContent = frame.text;
    el.classList.add('show');
    scheduleFit();
  } else if (frame.t === 'title') {
    sessionTitle = frame.text;
    renderDetails();
  } else if (frame.t === 'cwd') {
    sessionCwd = frame.path;
    renderDetails();
  }
}

async function signedOut() {
  try {
    const response = await fetch('/api/sessions', { cache: 'no-store' });
    return response.status === 401;
  } catch (_) {
    return false;
  }
}

function connect() {
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${scheme}://${location.host}/ws/view/${id}`);
  ws.binaryType = 'arraybuffer';

  ws.onmessage = (event) => {
    if (typeof event.data === 'string') {
      try { onControl(JSON.parse(event.data)); } catch (_) {}
    } else {
      ensureTerminal();
      term.write(new Uint8Array(event.data));
    }
  };
  socket = ws;
  ws.onopen = () => { backoff = 500; };
  ws.onclose = async () => {
    if (await signedOut()) return void location.reload();
    if (++failures >= 3) {
      badge.className = 'badge stale';
      badge.textContent = 'gone';
      notice.textContent =
        'This session no longer exists — it expired, or the relay restarted and '
        + 'the host reconnected under a new URL. Check the session list.';
      notice.classList.add('show');
      document.body.classList.add('frozen');
      return;
    }
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 15000);
  };
  ws.onerror = () => ws.close();
}

keybar.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.modifier === 'shift' || button.dataset.modifier === 'ctrl') {
    const isShift = button.dataset.modifier === 'shift';
    if (isShift) setShift(!shiftActive);
    else setCtrl(!ctrlActive);
    if (term) term.focus();
    return;
  }
  const sequence = keySequences[button.dataset.key];
  send(compose(sequence));
  setShift(false);
  setCtrl(false);
  if (term) term.focus();
});

addEventListener('keydown', (event) => {
  if (event.key === 'Shift') setShift(true);
  else if (event.key === 'Control') setCtrl(true);
});

addEventListener('keyup', (event) => {
  if (event.key === 'Shift') setShift(false);
  else if (event.key === 'Control') setCtrl(false);
});

keyboardToggle.addEventListener('click', () => {
  keybarOpen = !keybarOpen;
  storeKeybarPreference();
  applyInput(allowInput);
});

document.getElementById('banner-dismiss').addEventListener('click', () => {
  document.getElementById('banner').classList.remove('show');
  scheduleFit();
});

stage.addEventListener('click', () => {
  if (allowInput && status === 'live' && term) term.focus();
});

function cellHeight() {
  const el = screenEl();
  return term && el && term.rows ? el.offsetHeight / term.rows : 0;
}

function scrollByLines(lines) {
  if (term.buffer.active.type === 'normal') {
    term.scrollLines(lines);
    return;
  }
  const app = term.modes && term.modes.applicationCursorKeysMode;
  const key = lines < 0 ? (app ? '\x1bOA' : '\x1b[A') : (app ? '\x1bOB' : '\x1b[B');
  send(key.repeat(Math.min(Math.abs(lines), MAX_ALT_LINES)));
}

function panBy(pixels) {
  const height = cellHeight();
  if (!height) return;
  touchResidue += pixels / height;
  const lines = Math.trunc(touchResidue);
  touchResidue -= lines;
  if (lines) scrollByLines(lines);
}

function stopFling() {
  if (fling !== null) cancelAnimationFrame(fling);
  fling = null;
}

function startFling() {
  let velocity = Math.max(-MAX_FLING, Math.min(MAX_FLING, touchVelocity));
  let previous = performance.now();
  const step = (now) => {
    const elapsed = Math.min(48, now - previous);
    previous = now;
    panBy(-velocity * elapsed);
    velocity *= Math.pow(FLING_DECAY, elapsed / 16.7);
    fling = Math.abs(velocity) > FLING_CUTOFF ? requestAnimationFrame(step) : null;
  };
  fling = requestAnimationFrame(step);
}

function trackedTouch(event) {
  for (const touch of event.changedTouches) {
    if (touch.identifier === touchId) return touch;
  }
  return null;
}

host.addEventListener('touchstart', (event) => {
  stopFling();
  if (!term || event.touches.length > 1) {
    touchId = null;
    return;
  }
  const touch = event.changedTouches[0];
  touchId = touch.identifier;
  touchY = touch.clientY;
  touchAt = event.timeStamp;
  touchVelocity = 0;
  touchResidue = 0;
  dragging = false;
}, { passive: true });

host.addEventListener('touchmove', (event) => {
  if (touchId === null) return;
  const touch = trackedTouch(event);
  if (!touch) return;
  const delta = touch.clientY - touchY;
  if (!dragging && Math.abs(delta) < TOUCH_SLOP) return;
  dragging = true;
  event.preventDefault();
  const elapsed = Math.max(1, event.timeStamp - touchAt);
  touchVelocity = elapsed > FLING_GAP ? 0 : (delta / elapsed) * 0.8 + touchVelocity * 0.2;
  touchY = touch.clientY;
  touchAt = event.timeStamp;
  panBy(-delta);
}, { passive: false });

host.addEventListener('touchend', (event) => {
  if (touchId === null || !trackedTouch(event)) return;
  touchId = null;
  if (dragging && event.timeStamp - touchAt < FLING_GAP) startFling();
  dragging = false;
});

host.addEventListener('touchcancel', () => {
  touchId = null;
  dragging = false;
  stopFling();
});

let pending = null;
addEventListener('resize', () => {
  clearTimeout(pending);
  pending = setTimeout(scheduleFit, 120);
});

connect();
</script>
</body>
</html>
