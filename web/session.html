<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tcomp session</title>
<link rel="stylesheet" href="/static/xterm.css">
<link rel="stylesheet" href="/static/app.css">
<style>
  body { display: flex; flex-direction: column; overflow: hidden; }
  .back { color: var(--muted); font-size: 20px; line-height: 1; padding: 0 4px; }
  .back:hover { color: var(--text); }
  .size { color: var(--muted); font-size: 12px; font-family: ui-monospace, Menlo, monospace; }

  .notice {
    display: none;
    padding: 8px 18px;
    background: #232b38;
    border-bottom: 1px solid var(--edge);
    color: var(--muted);
    font-size: 13px;
  }
  .notice.show { display: block; }

  #stage {
    flex: 1;
    min-height: 0;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 10px;
    background: #05070b;
  }

  body.frozen #host { filter: grayscale(.85) brightness(.82); }
  .xterm .xterm-viewport { overflow-y: auto; }

  .keybar {
    display: none;
    gap: 6px;
    padding: 8px 10px;
    border-top: 1px solid var(--edge);
    background: var(--panel);
    overflow-x: auto;
  }
  .keybar.show { display: flex; }
  .keybar button {
    flex: none;
    min-width: 44px;
    padding: 9px 12px;
    border: 1px solid var(--edge);
    border-radius: 7px;
    background: var(--panel-2);
    color: var(--text);
    font: 13px/1 ui-monospace, Menlo, monospace;
    cursor: pointer;
  }
  .keybar button:active { background: #2b3849; }

  @media (max-width: 560px) {
    .topbar { padding: 10px 12px; gap: 8px; }
    .size { display: none; }
    #stage { padding: 4px; align-items: flex-start; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="/" title="All sessions">‹</a>
  <div class="title"><b id="name">…</b><em id="cmd"></em></div>
  <div class="spacer"></div>
  <div class="size" id="size"></div>
  <div class="badge" id="badge"></div>
</header>
<div class="notice" id="notice"></div>
<main id="stage"><div id="host"></div></main>
<nav class="keybar" id="keybar">
  <button data-seq="\x1b">esc</button>
  <button data-seq="\t">tab</button>
  <button data-seq="\x03">^C</button>
  <button data-seq="\x04">^D</button>
  <button data-seq="\x1a">^Z</button>
  <button data-seq="\x1b[D">←</button>
  <button data-seq="\x1b[B">↓</button>
  <button data-seq="\x1b[A">↑</button>
  <button data-seq="\x1b[C">→</button>
</nav>

<script src="/static/xterm.js"></script>
<script>
const id = location.pathname.split('/').filter(Boolean).pop();
const stage = document.getElementById('stage');
const host = document.getElementById('host');
const badge = document.getElementById('badge');
const notice = document.getElementById('notice');
const BASE_FONT = 15;
const MIN_FONT = 4;
const MAX_FONT = 34;
const PAD = 10;

let term = null;
let socket = null;
let cols = 80;
let rows = 24;
let passes = 0;
let backoff = 500;
let allowInput = false;
let status = 'live';
let failures = 0;
const encoder = new TextEncoder();
const keybar = document.getElementById('keybar');

function ensureTerminal() {
  if (term) return;
  term = new Terminal({
    cols, rows,
    fontSize: BASE_FONT,
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
    scrollback: 5000,
    disableStdin: true,
    cursorBlink: false,
    theme: { background: '#05070b', foreground: '#dbe3ef' },
  });
  term.open(host);
  term.onData(send);
  scheduleFit();
}

function send(data) {
  if (!allowInput || status !== 'live' || !data) return;
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(encoder.encode(data));
  }
}

function applyInput(enabled) {
  allowInput = enabled;
  keybar.classList.toggle('show', enabled && status === 'live');
  if (term) {
    term.options.disableStdin = !(enabled && status === 'live');
    if (enabled && status === 'live') term.focus();
  }
  scheduleFit();
}

function screenEl() {
  return host.querySelector('.xterm-screen');
}

function scheduleFit() {
  passes = 0;
  requestAnimationFrame(refit);
}

function refit() {
  if (!term) return;
  const el = screenEl();
  if (!el || !el.offsetWidth) {
    if (passes++ < 20) requestAnimationFrame(refit);
    return;
  }

  const chrome = document.querySelector('.topbar').offsetHeight
    + (notice.classList.contains('show') ? notice.offsetHeight : 0)
    + (keybar.classList.contains('show') ? keybar.offsetHeight : 0);
  const availW = Math.max(60, document.documentElement.clientWidth - PAD);
  const availH = Math.max(60, document.documentElement.clientHeight - chrome - PAD);

  const ratio = Math.min(availW / el.offsetWidth, availH / el.offsetHeight);
  const current = term.options.fontSize;
  const next = Math.min(MAX_FONT, Math.max(MIN_FONT, Math.floor(current * ratio * 2) / 2));

  if (next !== current && passes++ < 6) {
    term.options.fontSize = next;
    setTimeout(refit, 60);
    return;
  }
  document.getElementById('size').textContent = `${cols}\u00d7${rows}`;
}

function applyStatus(next, exitCode) {
  status = next;
  badge.className = `badge ${status}`;
  badge.textContent = status === 'live'
    ? (allowInput ? 'interactive' : 'live')
    : status === 'ended' ? 'finished' : 'disconnected';
  document.body.classList.toggle('frozen', status !== 'live');
  applyInput(allowInput);
  if (status === 'live') {
    notice.classList.remove('show');
    return;
  }
  notice.textContent = status === 'ended'
    ? `Session ended${exitCode != null ? ` (exit ${exitCode})` : ''}. Showing final output.`
    : 'Host disconnected. History only — this view will not update again.';
  notice.classList.add('show');
}

function onControl(frame) {
  if (frame.t === 'init') {
    failures = 0;
    cols = frame.cols;
    rows = frame.rows;
    document.getElementById('name').textContent = frame.name;
    document.getElementById('cmd').textContent = frame.cmd;
    document.title = `${frame.name} — tcomp`;
    ensureTerminal();
    if (term.cols !== cols || term.rows !== rows) {
      term.resize(cols, rows);
    }
    scheduleFit();
    allowInput = !!frame.input;
    applyStatus(frame.status);
  } else if (frame.t === 'resize') {
    cols = frame.cols;
    rows = frame.rows;
    ensureTerminal();
    term.resize(cols, rows);
    scheduleFit();
  } else if (frame.t === 'status') {
    applyStatus(frame.status);
  } else if (frame.t === 'exit') {
    applyStatus('ended', frame.code);
  }
}

function connect() {
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${scheme}://${location.host}/ws/view/${id}`);
  ws.binaryType = 'arraybuffer';

  ws.onmessage = (event) => {
    if (typeof event.data === 'string') {
      try { onControl(JSON.parse(event.data)); } catch (_) {}
    } else {
      ensureTerminal();
      term.write(new Uint8Array(event.data));
    }
  };
  socket = ws;
  ws.onopen = () => { backoff = 500; };
  ws.onclose = () => {
    if (++failures >= 3) {
      badge.className = 'badge stale';
      badge.textContent = 'gone';
      notice.textContent =
        'This session no longer exists — it expired, or the relay restarted and '
        + 'the host reconnected under a new URL. Check the session list.';
      notice.classList.add('show');
      document.body.classList.add('frozen');
      return;
    }
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 15000);
  };
  ws.onerror = () => ws.close();
}

keybar.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  send(JSON.parse(`"${button.dataset.seq}"`));
  if (term) term.focus();
});

stage.addEventListener('click', () => {
  if (allowInput && status === 'live' && term) term.focus();
});

let pending = null;
addEventListener('resize', () => {
  clearTimeout(pending);
  pending = setTimeout(scheduleFit, 120);
});

connect();
</script>
</body>
</html>
