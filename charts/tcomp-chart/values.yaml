# Sessions live in memory, so a second replica cannot serve them.
replicaCount: 1

image:
  repository: ghcr.io/flodurorg/tcomp
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

updateStrategy:
  type: Recreate

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: tcomp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  apiVersion: gateway.networking.k8s.io/v1
  annotations: {}
  # Required when enabled, e.g. [{name: my-gateway, namespace: infra}].
  parentRefs: []
  hostnames: []
  matches:
    - path:
        type: PathPrefix
        value: /
  filters: []
  # Some implementations default to a request timeout that would cut the
  # websocket; set request and backendRequest to 0s to disable it.
  timeouts: {}
  # Gateway listeners hold the TLS config, so the scheme cannot be inferred.
  scheme: https

# Absolute URL viewers reach, e.g. https://tcomp.example.com.
# Derived from the first ingress host or httpRoute hostname when left empty.
publicUrl: ""

auth:
  # A token is generated when none is set below, and the one already in the
  # cluster is reused on upgrade. Disable only for a deliberately open relay.
  enabled: true
  token: ""
  existingSecret: ""
  existingSecretKey: token

config:
  endedTtl: 60
  staleTtl: 14400
  scrollback: 2000
  historyBytes: 524288

logLevel: tcomp=info

extraEnv: []

resources: {}

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
