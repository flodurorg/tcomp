[package]
name = "tcomp"
version = "0.3.1"
edition.workspace = true
license.workspace = true

[[bin]]
name = "tcomp"
path = "src/main.rs"

[workspace]
resolver = "2"
members = ["crates/proto"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
proto = { path = "crates/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "io-util", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies]
anyhow.workspace = true
proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
portable-pty = "0.9"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = "0.3.34"
bytes = "1.12.1"
avt = "0.18"
axum = { version = "0.8", features = ["ws"] }
dashmap = "6.2.1"
rand = "0.10.2"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }

[profile.release]
lto = "thin"
strip = true
